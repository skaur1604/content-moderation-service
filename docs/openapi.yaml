openapi: 3.0.0
info:
  title: "Content Moderation API - Public Documentation"
  version: "1.0.0"
  description: "Public-facing API documentation for Content Moderation Service"

servers:
  -  url: "http://localhost:3000/api/v1"
     description: "Local development server"

paths:
  moderation/post/{id}:
    get:
      summary: "Retrieve a post by ID"
      description: "Public endpoint to fetch a post"
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: "Post ID"
      responses:
        '200':
          description: "Post retrieved successfully"
          content:
            application/json:
              schema:
                type: object
